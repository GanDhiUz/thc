<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기술·가정 수업</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap">
<link rel="stylesheet" href="style.css?v=10">
</head>
<body>

<form id="login" class="card" hidden>
  <h1>기술·가정 수업</h1>
  <p class="muted" style="margin:0">반, 번호, 선생님께 받은 6자리 코드를 넣으세요.</p>
  <label>반
    <select id="cls" required>
      <option value="">고르기</option>
      <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
    </select>
  </label>
  <label>번호 <input id="num" type="number" min="1" max="99" required></label>
  <label>개인 코드 (6자리) <input id="code" inputmode="numeric" pattern="\d{6}" maxlength="6" autocomplete="off" required></label>
  <button class="primary">입장</button>
  <div class="err" id="loginErr" role="alert"></div>
</form>

<div id="confirm" class="card" hidden>
  <p class="big"><b id="myName"></b> 맞나요?</p>
  <button class="primary" id="yes">네, 맞아요</button>
  <button id="no">아니에요 (다시 입력)</button>
</div>

<div id="main" class="app" hidden>
  <div class="bar">
    <b id="who"></b>
    <select id="lesson" aria-label="차시"></select>
    <button id="vPdf">교과서</button>
    <button id="vPpt">PPT</button>
    <button id="vHtml">단원 자료</button>
    <button id="vBoard">화이트보드</button>
    <span id="quiz"></span>
    <span class="grow"></span>
    <span class="badge lock" id="lockBadge" hidden>선생님 화면 고정 중</span>
    <button id="logout">나가기</button>
  </div>
  <div class="body">
    <div class="viewer">
      <div class="pdfbox" id="pdfbox"><div class="sheet"><canvas id="canvas"></canvas><canvas id="ink"></canvas><canvas id="mark"></canvas></div></div>
      <div class="pager" id="pager"><button id="prev" aria-label="이전 쪽">◀</button><span id="pageNo"></span><button id="next" aria-label="다음 쪽">▶</button>
        <button id="zoomOut" aria-label="축소">－</button><button id="zoomNo" title="원래 크기로">100%</button><button id="zoomIn" aria-label="확대">＋</button>
        <span class="tools">
          <button id="pen">✏ 밑줄</button>
          <select id="color" aria-label="펜 색"><option value="#ffd60066">형광 노랑</option><option value="#66bb6a66">형광 초록</option><option value="#d32f2f">빨강 펜</option><option value="#1d2433">검정 펜</option><option value="#1565c0">파랑 펜</option></select>
          <select id="size" aria-label="굵기"><option value="0.002">가늘게</option><option value="0.004" selected>보통</option></select>
          <button id="eraser">지우개</button>
        </span>
      </div>
      <iframe id="frame" sandbox="allow-scripts allow-forms allow-popups allow-modals allow-downloads" title="단원 자료" hidden></iframe>
      <div class="empty" id="empty" hidden>자료가 아직 없습니다.</div>
    </div>
    <aside>
      <b>핵심 요약</b>
      <textarea id="summary" placeholder="교과서를 읽고 핵심 내용을 내 말로 정리해 보세요." maxlength="5000"></textarea>
      <button class="primary" id="submit">제출하기</button>
      <div class="muted" id="sumState"></div>
      <small class="muted">수업 중에는 선생님이 화면을 벗어났는지 볼 수 있어요</small>
    </aside>
  </div>
</div>
<div class="toast" id="backMsg" role="status" hidden></div>

<script type="module">
import { sb, $, esc, configured, studentEmail, loadLessons, PdfView, Ink, wireTools, showHtml, fmtTime, BOARD } from "./app.js?v=10";

const ink = new Ink($("#ink")); // 선생님 판서: 보기만
const mark = new Ink($("#mark"), (s) => localStorage.setItem(markKey(), JSON.stringify(s))); // 내 밑줄: 이 노트북에만
const pdf = new PdfView($("#canvas"), [ink, mark]);
wireTools(mark);
const lastPage = {};
let me, lessons = [], cur = { lesson: null, view: "pdf", page: 1 }, room, shownLesson = null;
const show = (id) => ["#login", "#confirm", "#main"].forEach((s) => ($(s).hidden = s !== id));
const draftKey = () => `draft:${me.id}:${cur.lesson}`;
const markKey = () => `mark:${me.id}:${cur.lesson}:${cur.view}:${cur.page}`;

async function start() {
  if (!configured) { show("#login"); $("#loginErr").textContent = "app.js 에 Supabase 주소와 키를 먼저 넣어야 합니다."; return; }
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return show("#login");
  const { data } = await sb.from("students").select("*").eq("id", session.user.id).maybeSingle();
  if (!data) { await sb.auth.signOut(); $("#loginErr").textContent = "학생 계정이 아닙니다."; return show("#login"); }
  me = data;
  if (sessionStorage.getItem("confirmed") === me.id) return enter();
  $("#myName").textContent = me.name;
  show("#confirm");
}

$("#login").onsubmit = async (e) => {
  e.preventDefault();
  $("#loginErr").textContent = "";
  const { error } = await sb.auth.signInWithPassword({ email: studentEmail($("#cls").value, $("#num").value), password: $("#code").value });
  if (error) { $("#loginErr").textContent = "반·번호·코드를 다시 확인하세요."; return; }
  $("#code").value = "";
  start();
};
$("#yes").onclick = () => { sessionStorage.setItem("confirmed", me.id); enter(); };
$("#no").onclick = $("#logout").onclick = async () => { sessionStorage.clear(); await sb.auth.signOut(); location.reload(); };

async function enter() {
  show("#main");
  $("#who").textContent = `${me.class_no}반 ${me.number}번 ${me.name}`;
  lessons = await loadLessons();
  $("#lesson").innerHTML = lessons.map((l) => `<option value="${l.id}">${esc(l.title)}</option>`).join("");
  cur.lesson = lessons[0]?.id ?? null;
  ({ data: room } = await sb.from("room_state").select("*").eq("class_no", me.class_no).single());
  sb.channel("room").on("postgres_changes", { event: "*", schema: "public", table: "room_state", filter: `class_no=eq.${me.class_no}` },
    (p) => { room = p.new; follow(); }).subscribe();
  sb.channel("ink").on("postgres_changes", { event: "*", schema: "public", table: "ink", filter: `class_no=eq.${me.class_no}` },
    (p) => { const r = p.new; if (r?.lesson_id === cur.lesson && r.doc === cur.view && r.page === cur.page) loadInk(); }).subscribe();
  follow();
  watchAway();
}

// 화면 이탈: 보는 중/벗어남만 실시간(Presence)으로 알린다. 데이터베이스에는 아무것도 남기지 않는다.
// 단원 자료(iframe) 안을 누르면 창 초점은 iframe 으로 가지만 document.hasFocus() 는 그대로 true 라 이탈이 아니다.
// iframe 에 초점이 있을 때 다른 프로그램으로 가면 이 창에 blur 가 안 오므로 1초마다 살핀다.
function watchAway() {
  const ch = sb.channel(`presence-${me.class_no}`, { config: { presence: { key: me.id } } });
  let away = false, since = 0, note = null, hideT;
  const check = () => {
    const now = document.hidden || !document.hasFocus();
    if (now === away) return;
    away = now;
    ch.track({ away });
    if (away) {
      since = Date.now();
      if (window.Notification?.permission === "granted") note = new Notification("수업 화면으로 돌아오세요", { tag: "away", requireInteraction: true });
    } else {
      note?.close(); note = null;
      const s = Math.round((Date.now() - since) / 1000);
      $("#backMsg").textContent = `수업 화면을 벗어났었어요 (${s >= 60 ? `${Math.floor(s / 60)}분 ` : ""}${s % 60}초)`;
      $("#backMsg").hidden = false;
      clearTimeout(hideT); hideT = setTimeout(() => ($("#backMsg").hidden = true), 8000);
    }
  };
  ch.subscribe((st) => st === "SUBSCRIBED" && ch.track({ away }));
  ["visibilitychange", "blur", "focus"].forEach((e) => addEventListener(e, () => setTimeout(check, 0)));
  setInterval(check, 1000);
  $("#backMsg").onclick = () => ($("#backMsg").hidden = true);
  // 알림 허용은 학생이 한 번 눌러야 묻는다. 거부하면 다시 묻지 않는다.
  if (window.Notification?.permission === "default") addEventListener("pointerdown", () => Notification.requestPermission(), { once: true });
}

// 선생님이 고정하면 같은 자료·같은 쪽으로 맞춘다. 늦게 들어와도 접속할 때 받은 상태로 맞춘다.
function follow() {
  const locked = !!room?.locked;
  $("#lockBadge").hidden = !locked;
  ["#lesson", "#vPdf", "#vPpt", "#vHtml", "#vBoard", "#prev", "#next"].forEach((s) => ($(s).disabled = locked));
  if (locked && room.lesson_id) cur = { lesson: room.lesson_id, view: room.view, page: room.page };
  render();
}

async function render() {
  const l = lessons.find((x) => x.id === cur.lesson);
  $("#lesson").value = cur.lesson ?? "";
  $("#vPdf").classList.toggle("on", cur.view === "pdf");
  $("#vPpt").classList.toggle("on", cur.view === "ppt");
  $("#vHtml").classList.toggle("on", cur.view === "html");
  $("#vBoard").classList.toggle("on", cur.view === "board");
  const link = (u, t) => /^https?:\/\//.test(u ?? "") ? `<a class="btn" href="${esc(u)}" target="_blank" rel="noopener">${t}</a> ` : "";
  $("#quiz").innerHTML = l ? link(l.quiz_intro, "도입 퀴즈") + link(l.quiz_outro, "마무리 퀴즈") : "";
  if (shownLesson !== cur.lesson) loadSummary();

  const path = cur.view === BOARD ? l && BOARD : l?.[cur.view + "_path"]; // 화이트보드는 파일 없이 열린다
  $("#empty").hidden = !!path;
  $("#pdfbox").hidden = $("#pager").hidden = !path || cur.view === "html";
  $("#frame").hidden = !path || cur.view !== "html";
  if (!path) return;
  try {
    if (cur.view === "html") return await showHtml($("#frame"), path);
    await pdf.open(path);
    await pdf.show(cur.page);
    cur.page = pdf.page;
    $("#pageNo").textContent = `${pdf.page} / ${pdf.pages}`;
    loadInk();
    try { mark.set(JSON.parse(localStorage.getItem(markKey()))); } catch { mark.set([]); }
  } catch (e) { $("#empty").hidden = false; $("#empty").textContent = "자료를 불러오지 못했습니다: " + e.message; }
}

$("#lesson").onchange = () => { cur = { lesson: Number($("#lesson").value), view: "pdf", page: 1 }; render(); };
function setView(v) { lastPage[`${cur.lesson}:${cur.view}`] = cur.page; cur.view = v; cur.page = lastPage[`${cur.lesson}:${v}`] ?? 1; render(); }
$("#vPdf").onclick = () => setView("pdf");
$("#vPpt").onclick = () => setView("ppt");
$("#vHtml").onclick = () => setView("html");
$("#vBoard").onclick = () => setView(BOARD);
$("#prev").onclick = () => { cur.page--; render(); };
$("#next").onclick = () => { cur.page++; render(); };
let t; addEventListener("resize", () => { clearTimeout(t); t = setTimeout(() => cur.view !== "html" && pdf.show(cur.page), 200); });

// 선생님 판서 (같은 반, 지금 보는 차시·자료·쪽)
async function loadInk() {
  const k = markKey();
  const { data } = await sb.from("ink").select("strokes").match({ class_no: me.class_no, lesson_id: cur.lesson, doc: cur.view, page: cur.page }).maybeSingle();
  if (k === markKey()) ink.set(data?.strokes);
}

// 요약: 제출 전 글은 이 노트북에 임시 저장, 제출하면 덮어쓴다
async function loadSummary() {
  shownLesson = cur.lesson;
  $("#summary").value = ""; $("#sumState").textContent = "";
  $("#summary").disabled = $("#submit").disabled = !cur.lesson;
  if (!cur.lesson) return;
  const lessonAtLoad = cur.lesson;
  const { data } = await sb.from("summaries").select("body, submitted_at").eq("student_id", me.id).eq("lesson_id", cur.lesson).maybeSingle();
  if (lessonAtLoad !== cur.lesson) return;
  const draft = localStorage.getItem(draftKey());
  $("#summary").value = draft ?? data?.body ?? "";
  $("#sumState").textContent = data ? `제출함 · ${fmtTime(data.submitted_at)}` + (draft != null ? " (고친 내용은 아직 제출 전)" : "") : "아직 제출하지 않았습니다.";
}
$("#summary").oninput = () => localStorage.setItem(draftKey(), $("#summary").value);
$("#submit").onclick = async () => {
  const body = $("#summary").value.trim();
  if (!body) return ($("#sumState").textContent = "내용을 쓰고 제출하세요.");
  $("#submit").disabled = true;
  const { data, error } = await sb.from("summaries")
    .upsert({ student_id: me.id, lesson_id: cur.lesson, body, submitted_at: new Date().toISOString() })
    .select("submitted_at").single();
  $("#submit").disabled = false;
  if (error) return ($("#sumState").textContent = "제출 실패: " + error.message + " (글은 이 노트북에 남아 있습니다)");
  localStorage.removeItem(draftKey());
  $("#sumState").textContent = `제출함 · ${fmtTime(data.submitted_at)}`;
};

start();
</script>
</body>
</html>
