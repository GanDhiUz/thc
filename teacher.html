<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수업 진행 (선생님)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<form id="login" class="card" hidden>
  <h1>선생님 로그인</h1>
  <label>이메일 <input id="email" type="email" required autocomplete="username"></label>
  <label>비밀번호 <input id="pw" type="password" required autocomplete="current-password"></label>
  <button class="primary">로그인</button>
  <div class="err" id="loginErr" role="alert"></div>
</form>

<div id="main" class="app" hidden>
  <div class="bar">
    <select id="cls" aria-label="반"><option value="1">1반</option><option value="2">2반</option><option value="3">3반</option><option value="4">4반</option><option value="5">5반</option></select>
    <select id="lesson" aria-label="차시"></select>
    <button id="vPdf">교과서</button>
    <button id="vPpt">PPT</button>
    <button id="vHtml">단원 자료</button>
    <span id="quiz"></span>
    <span class="grow"></span>
    <button id="lock">화면 고정 꺼짐</button>
    <button id="panel">패널</button>
    <button id="logout">로그아웃</button>
  </div>
  <div class="body" id="body">
    <div class="viewer">
      <div class="pdfbox" id="pdfbox"><div class="sheet"><canvas id="canvas"></canvas><canvas id="ink"></canvas></div></div>
      <div class="pager" id="pager"><button id="prev" aria-label="이전 쪽">◀</button><span id="pageNo"></span><button id="next" aria-label="다음 쪽">▶</button>
        <span class="tools">
          <button id="pen">✏ 판서</button>
          <select id="color" aria-label="펜 색"><option value="#d32f2f">빨강</option><option value="#1d2433">검정</option><option value="#1565c0">파랑</option><option value="#2e7d32">초록</option><option value="#ffd60066">형광 노랑</option></select>
          <select id="size" aria-label="굵기"><option value="0.002">가늘게</option><option value="0.004" selected>보통</option><option value="0.008">굵게</option></select>
          <button id="eraser">지우개</button>
          <button id="inkClear">판서 지우기</button>
          <span class="muted" id="inkMsg"></span>
        </span>
      </div>
      <iframe id="frame" sandbox="allow-scripts allow-forms allow-popups allow-modals allow-downloads" title="단원 자료" hidden></iframe>
      <div class="empty" id="empty" hidden>자료가 없습니다. 관리 탭에서 올리세요.</div>
    </div>
    <aside>
      <div class="tabs"><button data-tab="tSum" class="on">요약</button><button data-tab="tStu">학생별</button><button data-tab="tAdm">관리</button></div>

      <section id="tSum">
        <div style="display:flex;gap:6px;align-items:center"><b id="sumCount" style="flex:1"></b><button class="primary" id="toBoard">고른 요약 크게 보기</button></div>
        <div id="sumList" style="display:grid;gap:6px;margin-top:8px"></div>
      </section>

      <section id="tStu" hidden>
        <select id="stu" aria-label="학생" style="width:100%"></select>
        <div style="display:flex;gap:6px;margin:8px 0"><button id="stuSave">파일로 내려받기</button><button id="stuPrint">인쇄 / PDF 저장</button></div>
        <div id="stuList" style="display:grid;gap:6px"></div>
      </section>

      <section id="tAdm" hidden>
        <h3>차시 자료</h3>
        <table><thead><tr><th>순서</th><th>제목</th><th>PDF</th><th>PPT</th><th>HTML</th><th></th></tr></thead><tbody id="lessonRows"></tbody></table>
        <form id="lessonForm" class="form" style="margin-top:8px">
          <b id="lfTitle">새 차시 추가</b>
          <label>순서 <input id="lfOrd" type="number" value="1" required></label>
          <label>제목 <input id="lfName" required placeholder="예: 4-3-1 발명의 개념"></label>
          <label>교과서 PDF <input id="lfPdf" type="file" accept="application/pdf"></label>
          <label class="muted" hidden><input type="checkbox" id="lfPdfDel"> 올린 교과서 PDF 지우기</label>
          <label>PPT용 PDF (PowerPoint 에서 PDF 로 저장한 파일) <input id="lfPpt" type="file" accept="application/pdf"></label>
          <label class="muted" hidden><input type="checkbox" id="lfPptDel"> 올린 PPT용 PDF 지우기</label>
          <label>단원 HTML <input id="lfHtml" type="file" accept=".html,text/html"></label>
          <label class="muted" hidden><input type="checkbox" id="lfHtmlDel"> 올린 단원 HTML 지우기</label>
          <label>도입 퀴즈 링크 (젭퀴즈) <input id="lfQ1" type="url" placeholder="https://"></label>
          <label>마무리 퀴즈 링크 <input id="lfQ2" type="url" placeholder="https://"></label>
          <div style="display:flex;gap:6px"><button class="primary">저장</button><button type="button" id="lfReset">새로 쓰기</button></div>
          <div class="muted" id="lfMsg"></div>
        </form>

        <h3>학생 명단 올리기</h3>
        <p class="muted">엑셀에서 <b>반, 번호, 이름</b> 세 칸을 복사해 붙여 넣으세요. 개인 코드는 지금 한 번만 보여 주니 꼭 인쇄해 두세요.</p>
        <textarea id="roster" rows="6" style="width:100%" placeholder="1	1	가짜학생&#10;1	2	테스트학생"></textarea>
        <label class="muted"><input type="checkbox" id="reset"> 이미 있는 학생도 코드를 새로 발급 (코드를 잃어버렸을 때)</label>
        <button class="primary" id="rosterGo">계정 만들기</button>
        <div id="rosterOut"></div>
      </section>
    </aside>
  </div>
</div>

<div class="board" id="board" hidden><button class="close" id="boardClose">닫기 ✕</button><div class="grid" id="boardGrid"></div></div>

<script type="module">
import { sb, $, esc, configured, loadLessons, PdfView, Ink, wireTools, showHtml, saveHtml, printHtml, fmtTime } from "./app.js";

const ink = new Ink($("#ink"), saveInk);
const pdf = new PdfView($("#canvas"), [ink]);
wireTools(ink);
const lastPage = {}; // 자료를 오가도 각 자료의 쪽을 기억한다
let lessons = [], students = [], cls = 1, cur = { lesson: null, view: "pdf", page: 1 }, locked = false, sums = [], editing = null;
const picked = new Set();

async function start() {
  if (!configured) { $("#login").hidden = false; $("#loginErr").textContent = "app.js 에 Supabase 주소와 키를 먼저 넣어야 합니다."; return; }
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return ($("#login").hidden = false);
  if (session.user.app_metadata?.role !== "teacher") {
    await sb.auth.signOut();
    $("#loginErr").textContent = "선생님 계정이 아닙니다.";
    return ($("#login").hidden = false);
  }
  $("#login").hidden = true; $("#main").hidden = false;
  lessons = await loadLessons();
  fillLessons();
  await openClass(1);
  sb.channel("sums").on("postgres_changes", { event: "*", schema: "public", table: "summaries" },
    (p) => p.new?.lesson_id === cur.lesson && loadSums()).subscribe();
}

$("#login").onsubmit = async (e) => {
  e.preventDefault();
  const { error } = await sb.auth.signInWithPassword({ email: $("#email").value, password: $("#pw").value });
  if (error) return ($("#loginErr").textContent = "로그인 실패: " + error.message);
  start();
};
$("#logout").onclick = async () => { await sb.auth.signOut(); location.reload(); };

function fillLessons() {
  $("#lesson").innerHTML = lessons.map((l) => `<option value="${l.id}">${esc(l.title)}</option>`).join("");
  $("#lessonRows").innerHTML = lessons.map((l) => `<tr><td>${l.ord}</td><td>${esc(l.title)}</td><td>${l.pdf_path ? "✓" : ""}</td><td>${l.ppt_path ? "✓" : ""}</td><td>${l.html_path ? "✓" : ""}</td>
    <td><button data-edit="${l.id}">고치기</button> <button data-del="${l.id}">지우기</button></td></tr>`).join("");
}

// 반을 바꾸면 그 반이 멈춰 있던 자료·쪽에서 이어 간다
async function openClass(c) {
  cls = c; $("#cls").value = c; picked.clear();
  const { data: room } = await sb.from("room_state").select("*").eq("class_no", c).single();
  locked = !!room?.locked;
  cur = { lesson: room?.lesson_id ?? lessons[0]?.id ?? null, view: room?.view ?? "pdf", page: room?.page ?? 1 };
  ({ data: students } = await sb.from("students").select("id, number, name").eq("class_no", c).order("number"));
  $("#stu").innerHTML = `<option value="">학생 고르기</option>` + students.map((s) => `<option value="${s.id}">${s.number}번 ${esc(s.name)}</option>`).join("");
  $("#stuList").innerHTML = "";
  loadSums();
  await render(false);
}

// 선생님 화면을 그리고, 그 상태를 반 학생들에게 알린다 (고정 켜짐일 때만 학생이 따라온다)
async function render(push = true) {
  const l = lessons.find((x) => x.id === cur.lesson);
  $("#lesson").value = cur.lesson ?? "";
  $("#vPdf").classList.toggle("on", cur.view === "pdf");
  $("#vPpt").classList.toggle("on", cur.view === "ppt");
  $("#vHtml").classList.toggle("on", cur.view === "html");
  $("#lock").classList.toggle("on", locked);
  $("#lock").textContent = locked ? "화면 고정 켜짐" : "화면 고정 꺼짐";
  const link = (u, t) => /^https?:\/\//.test(u ?? "") ? `<a class="btn" href="${esc(u)}" target="_blank" rel="noopener">${t}</a> ` : "";
  $("#quiz").innerHTML = l ? link(l.quiz_intro, "도입 퀴즈") + link(l.quiz_outro, "마무리 퀴즈") : "";

  if (push) { // 그리기 전에 먼저 알려서 학생 화면이 늦지 않게
    const { error } = await sb.from("room_state").upsert({ class_no: cls, lesson_id: cur.lesson, view: cur.view, page: cur.page, locked, updated_at: new Date().toISOString() });
    if (error) alert("학생 화면에 알리지 못했습니다: " + error.message);
  }
  const path = l?.[cur.view + "_path"]; // pdf_path, ppt_path, html_path
  $("#empty").hidden = !!path;
  $("#pdfbox").hidden = $("#pager").hidden = !path || cur.view === "html";
  $("#frame").hidden = !path || cur.view !== "html";
  try {
    if (path && cur.view === "html") await showHtml($("#frame"), path);
    if (path && cur.view !== "html") {
      await pdf.open(path);
      await pdf.show(cur.page);
      cur.page = pdf.page;
      $("#pageNo").textContent = `${pdf.page} / ${pdf.pages}`;
      loadInk();
    }
  } catch (e) { $("#empty").hidden = false; $("#empty").textContent = "자료를 불러오지 못했습니다: " + e.message; }
}

$("#cls").onchange = () => openClass(Number($("#cls").value));
$("#lesson").onchange = () => { cur = { lesson: Number($("#lesson").value), view: "pdf", page: 1 }; picked.clear(); render(); loadSums(); };
function setView(v) { lastPage[`${cur.lesson}:${cur.view}`] = cur.page; cur.view = v; cur.page = lastPage[`${cur.lesson}:${v}`] ?? 1; render(); }
$("#vPdf").onclick = () => setView("pdf");
$("#vPpt").onclick = () => setView("ppt");
$("#vHtml").onclick = () => setView("html");
$("#prev").onclick = () => { if (cur.page > 1) { cur.page--; render(); } };
$("#next").onclick = () => { if (cur.page < pdf.pages) { cur.page++; render(); } };
$("#lock").onclick = () => { locked = !locked; render(); };
$("#panel").onclick = () => { $("#body").classList.toggle("wide"); setTimeout(() => cur.view !== "html" && pdf.show(cur.page), 50); };
let t; addEventListener("resize", () => { clearTimeout(t); t = setTimeout(() => cur.view !== "html" && pdf.show(cur.page), 200); });

// 판서: 반·차시·자료·쪽마다 따로 저장한다. 같은 반 학생 화면에는 실시간으로 나타난다.
const inkKey = () => ({ class_no: cls, lesson_id: cur.lesson, doc: cur.view, page: cur.page });
async function loadInk() {
  const k = JSON.stringify(inkKey());
  ink.set([]);
  const { data, error } = await sb.from("ink").select("strokes").match(inkKey()).maybeSingle();
  if (k !== JSON.stringify(inkKey())) return; // 그사이 쪽이 바뀜
  if (error) $("#inkMsg").textContent = "판서를 불러오지 못했습니다: " + error.message;
  ink.set(data?.strokes);
}
let saveQ = Promise.resolve(); // 차례대로 저장해서 예전 판서가 나중 것을 덮지 않게
function saveInk(strokes) {
  const row = { ...inkKey(), strokes, updated_at: new Date().toISOString() };
  saveQ = saveQ.then(async () => {
    const { error } = await sb.from("ink").upsert(row);
    $("#inkMsg").textContent = error ? "판서 저장 실패: " + error.message : "";
  });
}
$("#inkClear").onclick = () => {
  if (ink.strokes.length && confirm("이 쪽의 판서를 모두 지울까요? 되돌릴 수 없습니다.")) { ink.set([]); saveInk(ink.strokes); }
};

document.querySelectorAll("[data-tab]").forEach((b) => (b.onclick = () => {
  document.querySelectorAll("[data-tab]").forEach((x) => { x.classList.toggle("on", x === b); $("#" + x.dataset.tab).hidden = x !== b; });
}));

// 요약 탭: 지금 반·차시의 제출 현황, 골라서 칠판에 크게
async function loadSums() {
  if (!cur.lesson) { $("#sumList").innerHTML = ""; $("#sumCount").textContent = ""; return; }
  const { data } = await sb.from("summaries").select("student_id, body, submitted_at").eq("lesson_id", cur.lesson).in("student_id", students.map((s) => s.id));
  sums = data ?? [];
  const by = new Map(sums.map((s) => [s.student_id, s]));
  $("#sumCount").textContent = `제출 ${sums.length} / ${students.length}명`;
  $("#sumList").innerHTML = students.map((s) => {
    const x = by.get(s.id);
    return x ? `<div class="sum"><label><input type="checkbox" data-pick="${s.id}" ${picked.has(s.id) ? "checked" : ""}>${s.number}번 ${esc(s.name)} <span class="muted">${fmtTime(x.submitted_at)}</span></label><p>${esc(x.body)}</p></div>`
      : `<div class="sum none">${s.number}번 ${esc(s.name)} — 아직</div>`;
  }).join("");
}
$("#sumList").onchange = (e) => { const id = e.target.dataset.pick; if (id) e.target.checked ? picked.add(id) : picked.delete(id); };
$("#toBoard").onclick = () => {
  const chosen = students.filter((s) => picked.has(s.id)).map((s) => ({ s, x: sums.find((y) => y.student_id === s.id) })).filter((o) => o.x);
  if (!chosen.length) return alert("크게 볼 요약을 먼저 고르세요.");
  $("#boardGrid").innerHTML = chosen.map(({ s, x }) => `<div class="item"><h3>${s.number}번 ${esc(s.name)}</h3><p>${esc(x.body)}</p></div>`).join("");
  $("#board").hidden = false;
};
$("#boardClose").onclick = () => ($("#board").hidden = true);
addEventListener("keydown", (e) => e.key === "Escape" && ($("#board").hidden = true));

// 학생별 탭: 한 학생의 차시별 요약을 차시 순서대로
let stuDoc = null;
$("#stu").onchange = async () => {
  const s = students.find((x) => x.id === $("#stu").value);
  stuDoc = null; $("#stuList").innerHTML = "";
  if (!s) return;
  const { data } = await sb.from("summaries").select("lesson_id, body, submitted_at").eq("student_id", s.id);
  const by = new Map((data ?? []).map((x) => [x.lesson_id, x]));
  const rows = lessons.map((l) => ({ l, x: by.get(l.id) }));
  $("#stuList").innerHTML = rows.map(({ l, x }) => `<div class="sum ${x ? "" : "none"}"><b>${esc(l.title)}</b>${x ? `<span class="muted">${fmtTime(x.submitted_at)}</span><p>${esc(x.body)}</p>` : " — 제출 안 함"}</div>`).join("");
  const title = `${cls}반 ${s.number}번 ${s.name} 핵심 요약`;
  stuDoc = { name: `${cls}반${String(s.number).padStart(2, "0")}번_${s.name}_핵심요약.html`, html: `<!doctype html><html lang="ko"><meta charset="utf-8"><title>${esc(title)}</title>
<style>body{font-family:"Malgun Gothic",sans-serif;max-width:760px;margin:24px auto;line-height:1.6}section{border-bottom:1px solid #ccc;padding:10px 0;break-inside:avoid}p{white-space:pre-wrap;margin:4px 0}small{color:#666}</style>
<h1>${esc(title)}</h1>` + rows.map(({ l, x }) => `<section><h3>${esc(l.title)}</h3>${x ? `<small>제출 ${fmtTime(x.submitted_at)}</small><p>${esc(x.body)}</p>` : "<p><i>제출 안 함</i></p>"}</section>`).join("") + "</html>" };
};
$("#stuSave").onclick = () => stuDoc ? saveHtml(stuDoc.name, stuDoc.html) : alert("학생을 먼저 고르세요.");
$("#stuPrint").onclick = () => stuDoc ? printHtml(stuDoc.html) : alert("학생을 먼저 고르세요.");

// 관리 탭: 차시 추가·고치기 (파일은 비공개 저장소로)
const FILES = [["#lfPdf", "pdf_path", "book.pdf"], ["#lfPpt", "ppt_path", "ppt.pdf"], ["#lfHtml", "html_path", "unit.html"]];
function editLesson(l) {
  editing = l ?? null;
  $("#lfTitle").textContent = l ? `고치기: ${l.title}` : "새 차시 추가";
  $("#lfOrd").value = l?.ord ?? (lessons.at(-1)?.ord ?? 0) + 1;
  $("#lfName").value = l?.title ?? "";
  $("#lfQ1").value = l?.quiz_intro ?? ""; $("#lfQ2").value = l?.quiz_outro ?? "";
  $("#lfPdf").value = $("#lfPpt").value = $("#lfHtml").value = ""; $("#lfMsg").textContent = "";
  for (const [id, col] of FILES) { $(id + "Del").checked = false; $(id + "Del").parentElement.hidden = !l?.[col]; } // 올린 파일이 있을 때만 지우기 칸
}
$("#lfReset").onclick = () => editLesson(null);
$("#lessonRows").onclick = async (e) => {
  const edit = e.target.dataset.edit, del = e.target.dataset.del;
  if (edit) editLesson(lessons.find((l) => l.id === Number(edit)));
  if (del) {
    const l = lessons.find((x) => x.id === Number(del));
    if (!confirm(`"${l.title}" 차시를 지울까요? 이 차시에 학생들이 낸 요약과 판서도 함께 지워지고 되돌릴 수 없습니다.`)) return;
    const { error } = await sb.from("lessons").delete().eq("id", l.id);
    if (error) return alert("지우지 못했습니다: " + error.message);
    await sb.storage.from("materials").remove([l.pdf_path, l.ppt_path, l.html_path].filter(Boolean));
    lessons = await loadLessons(); fillLessons(); render(false);
  }
};
$("#lessonForm").onsubmit = async (e) => {
  e.preventDefault();
  const msg = (m) => ($("#lfMsg").textContent = m);
  const drop = FILES.filter(([id, col]) => $(id + "Del").checked && !$(id).files[0] && editing?.[col]);
  if (drop.length && !confirm("고른 파일을 지울까요? 그 자료 위의 판서도 함께 지워지고 되돌릴 수 없습니다.")) return;
  const row = { ord: Number($("#lfOrd").value), title: $("#lfName").value.trim(), quiz_intro: $("#lfQ1").value.trim() || null, quiz_outro: $("#lfQ2").value.trim() || null };
  msg("저장하는 중…");
  const q = editing ? sb.from("lessons").update(row).eq("id", editing.id) : sb.from("lessons").insert(row);
  const { data: saved, error } = await q.select().single();
  if (error) return msg("저장 실패: " + error.message);
  const files = {};
  for (const [input, col, name] of FILES) {
    const f = $(input).files[0];
    if (!f) continue;
    const path = `lesson-${saved.id}/${name}`;
    msg(`${f.name} 올리는 중…`);
    const { error: upErr } = await sb.storage.from("materials").upload(path, f, { upsert: true, contentType: f.type || undefined });
    if (upErr) return msg("파일 올리기 실패: " + upErr.message);
    files[col] = path;
  }
  for (const [, col] of drop) files[col] = null;
  if (Object.keys(files).length) {
    const { error: fErr } = await sb.from("lessons").update(files).eq("id", saved.id);
    if (fErr) return msg("파일 정보 저장 실패: " + fErr.message);
  }
  if (drop.length) { // 표에서 먼저 뺀 뒤 저장소에서 지운다 (실패해도 학생 화면엔 안 보임)
    const { error: rmErr } = await sb.storage.from("materials").remove(drop.map(([, col]) => editing[col]));
    const docs = drop.map(([, col]) => col.split("_")[0]).filter((d) => d !== "html");
    if (docs.length) await sb.from("ink").delete().eq("lesson_id", saved.id).in("doc", docs);
    if (rmErr) msg("저장소에서 파일을 지우지 못했습니다: " + rmErr.message);
  }
  lessons = await loadLessons(); fillLessons(); editLesson(null);
  if (!cur.lesson) { cur.lesson = saved.id; render(); }
  msg("저장했습니다. (바뀐 파일은 화면을 새로 고치면 보입니다)");
};

// 학생 명단 → 계정 + 개인 코드
$("#rosterGo").onclick = async () => {
  const rows = $("#roster").value.split(/\r?\n/).map((line) => line.split(/[\t,]/).map((c) => c.trim()))
    .filter((c) => c.length >= 3 && /^\d+$/.test(c[0]) && /^\d+$/.test(c[1]))
    .map(([class_no, number, name]) => ({ class_no: Number(class_no), number: Number(number), name }));
  if (!rows.length) return alert("반, 번호, 이름 세 칸으로 된 줄이 없습니다.");
  $("#rosterOut").textContent = `${rows.length}명 처리 중…`;
  const { data, error } = await sb.functions.invoke("create-students", { body: { rows, reset: $("#reset").checked } });
  // 함수가 2xx 가 아닌 답을 주면 이유는 error.context(응답) 안에 있다
  const why = error?.context?.json ? (await error.context.json().catch(() => null))?.error : null;
  if (error || data?.error) return ($("#rosterOut").textContent = "실패: " + (data?.error ?? why ?? error.message));
  const table = `<table><thead><tr><th>반</th><th>번호</th><th>이름</th><th>개인 코드</th><th>결과</th></tr></thead><tbody>` +
    data.results.map((r) => `<tr><td>${r.class_no}</td><td>${r.number}</td><td>${esc(r.name)}</td><td style="font-size:1.3em;letter-spacing:.1em"><b>${r.code ?? ""}</b></td><td>${esc(r.status)}</td></tr>`).join("") + "</tbody></table>";
  $("#rosterOut").innerHTML = `<button class="primary" id="codePrint" style="margin:8px 0">코드표 인쇄</button>` + table;
  $("#codePrint").onclick = () => printHtml(`<!doctype html><html lang="ko"><meta charset="utf-8"><title>개인 코드표</title><style>body{font-family:"Malgun Gothic",sans-serif}table{border-collapse:collapse;width:100%}td,th{border:1px solid #999;padding:8px}</style><h2>기술·가정 수업 개인 코드 (잘라서 나눠 주세요)</h2>${table}</html>`);
  $("#roster").value = "";
  if (rows.some((r) => r.class_no === cls)) openClass(cls);
};

start();
</script>
</body>
</html>
